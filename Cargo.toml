[package]
name = "focus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Pomodoro e tarefas para Linux"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true

